<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | اعلانات ضروری</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin.css"></head><body><header><a href="/" class="brand"><span>+</span> اعلانات ضروری <small> / پنل مدیریت</small></a><button id="logout" hidden>خروج</button></header><main><section id="login" class="login-card"><div class="lock">⌑</div><h1>ورود امن مدیر</h1><p>کد یک‌بارمصرف به شمارهٔ مدیر سامانه ارسال می‌شود.</p><form id="requestForm"><label>شمارهٔ مدیر<input name="phone" type="tel" placeholder="+937XXXXXXXX" required pattern="\+[1-9][0-9]{7,14}" autocomplete="tel"></label><button>ارسال کد ورود</button></form><form id="verifyForm" hidden><label>کد پیامکی<input name="code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" required></label><button>تأیید و ورود</button><button type="button" class="link-button" id="backToPhone">بازگشت</button></form><div id="loginMessage" role="status"></div></section><section id="dashboard" hidden><div class="dash-heading"><div><span>مدیریت محتوا</span><h1>اعلان‌ها</h1></div><select id="statusFilter"><option value="pending">در انتظار بررسی</option><option value="verified">تأیید شده</option><option value="rejected">رد شده</option><option value="resolved">حل شده</option><option value="all">همه</option></select></div><div class="summary" id="summary"></div><div class="table-wrap"><table><thead><tr><th>اعلان</th><th>نوع / وضعیت</th><th>منطقه</th><th>تماس خصوصی</th><th>زمان ثبت</th><th>اقدامات</th></tr></thead><tbody id="rows"></tbody></table></div><p class="privacy">شماره‌های تماس فقط در این پنل مدیر نمایش داده می‌شوند. مکان‌های عمومی تقریبی هستند.</p></section></main><div class="toast" id="toast" role="status"></div><script src="/admin.js"></script></body></html>
