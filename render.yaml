services:
  - type: web
    name: essential-notices
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: essential_notices
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
